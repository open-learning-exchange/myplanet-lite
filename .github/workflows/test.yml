name: myPlanet-Lite test

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: myPlanet-Lite test
    runs-on: ubuntu-24.04

    steps:
      - name: checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: run unit tests
        shell: bash
        run: |
          ./gradlew testDebugUnitTest --configuration-cache-problems=warn --warning-mode all --stacktrace --parallel --max-workers=4
